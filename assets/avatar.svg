<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="glow" cx="50%" cy="28%" r="62%">
      <stop offset="0%"   stop-color="#00e5ff"    stop-opacity=".22"/>
      <stop offset="55%"  stop-color="#ff2d78" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0a0d14"     stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirtG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#252a33"/>
      <stop offset="50%"  stop-color="#333944"/>
      <stop offset="100%" stop-color="#252a33"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%"   stop-color="#a26c46"/>
      <stop offset="45%"  stop-color="#c08457"/>
      <stop offset="100%" stop-color="#a26c46"/>
    </linearGradient>
    <linearGradient id="fadeOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0d14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0a0d14"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <ellipse cx="256" cy="250" rx="210" ry="200" fill="#00e5ff" opacity=".05" filter="url(#softer)"/>

  <!-- shoulders -->
  <path d="M84 512 C92 438 148 410 200 398 L312 398 C364 410 420 438 428 512 Z"
        fill="url(#shirtG)"/>
  <path d="M200 398 C222 424 290 424 312 398 C300 430 278 442 256 442
           C234 442 212 430 200 398 Z" fill="#252a33"/>
  <path d="M84 512 C92 438 148 410 200 398" fill="none"
        stroke="#00e5ff" stroke-opacity=".5" stroke-width="3"/>
  <path d="M428 512 C420 438 364 410 312 398" fill="none"
        stroke="#ff2d78" stroke-opacity=".45" stroke-width="3"/>

  <!-- neck -->
  <path d="M226 330 L286 330 L286 392 C286 404 226 404 226 392 Z" fill="#a26c46"/>

  <!-- hair, behind the head -->
      <circle cx="256" cy="198" r="120" fill="#151a26" opacity="1"/>
      <circle cx="162" cy="178" r="56" fill="#151a26" opacity="1"/>
      <circle cx="214" cy="144" r="58" fill="#151a26" opacity="1"/>
      <circle cx="268" cy="132" r="60" fill="#151a26" opacity="1"/>
      <circle cx="322" cy="150" r="56" fill="#151a26" opacity="1"/>
      <circle cx="358" cy="190" r="52" fill="#151a26" opacity="1"/>
      <circle cx="150" cy="236" r="48" fill="#151a26" opacity="1"/>
      <circle cx="366" cy="238" r="48" fill="#151a26" opacity="1"/>
      <circle cx="190" cy="112" r="32" fill="#151a26" opacity="1"/>
      <circle cx="244" cy="100" r="34" fill="#151a26" opacity="1"/>
      <circle cx="302" cy="110" r="32" fill="#151a26" opacity="1"/>
      <circle cx="346" cy="128" r="28" fill="#151a26" opacity="1"/>
      <circle cx="140" cy="196" r="34" fill="#151a26" opacity="1"/>
      <circle cx="378" cy="204" r="32" fill="#151a26" opacity="1"/>

  <!-- ears -->
  <ellipse cx="168" cy="272" rx="15" ry="22" fill="#a26c46"/>
  <ellipse cx="344" cy="272" rx="15" ry="22" fill="#a26c46"/>

  <!-- face -->
  <path d="M170 236 C170 196 200 172 256 172 C312 172 342 196 342 236
           L342 286 C342 334 306 366 256 366 C206 366 170 334 170 286 Z"
        fill="url(#faceG)"/>

  <!-- brows -->
  <path d="M188 232 C202 222 228 220 242 226" fill="none" stroke="#151a26"
        stroke-width="9" stroke-linecap="round"/>
  <path d="M270 226 C284 220 310 222 324 232" fill="none" stroke="#151a26"
        stroke-width="9" stroke-linecap="round"/>

  <!-- eyes - iris centred so the gaze reads straight at the viewer -->
  <ellipse cx="205" cy="272" rx="17" ry="20" fill="#0f131b"/>
  <ellipse cx="307" cy="272" rx="17" ry="20" fill="#0f131b"/>
  <circle cx="205" cy="272" r="7.5" fill="#00e5ff" opacity=".95"/>
  <circle cx="307" cy="272" r="7.5" fill="#00e5ff" opacity=".95"/>
  <circle cx="205" cy="272" r="3" fill="#06202a"/>
  <circle cx="307" cy="272" r="3" fill="#06202a"/>
  <circle cx="199.5" cy="265" r="3.4" fill="#ffffff" opacity=".7"/>
  <circle cx="301.5" cy="265" r="3.4" fill="#ffffff" opacity=".7"/>

  <!-- nose + mouth -->
  <path d="M254 292 C250 302 250 308 258 310" fill="none" stroke="#a26c46"
        stroke-width="4" stroke-linecap="round"/>
  <path d="M238 332 C248 341 264 341 274 332" fill="none" stroke="#8d5a38"
        stroke-width="5" stroke-linecap="round"/>

  <!-- fringe over the forehead -->
      <circle cx="196" cy="176" r="46" fill="#222b3d" opacity="1"/>
      <circle cx="250" cy="162" r="50" fill="#222b3d" opacity="1"/>
      <circle cx="306" cy="174" r="46" fill="#222b3d" opacity="1"/>
      <circle cx="160" cy="198" r="38" fill="#222b3d" opacity="1"/>
      <circle cx="352" cy="200" r="38" fill="#222b3d" opacity="1"/>
      <circle cx="222" cy="138" r="34" fill="#222b3d" opacity="1"/>
      <circle cx="288" cy="140" r="34" fill="#222b3d" opacity="1"/>
      <circle cx="196" cy="170" r="40" fill="#151a26" opacity="1"/>
      <circle cx="250" cy="156" r="44" fill="#151a26" opacity="1"/>
      <circle cx="306" cy="168" r="40" fill="#151a26" opacity="1"/>

  <!-- glasses -->
  <g>
    <rect x="164" y="242" width="80" height="62" rx="14"
          fill="#00e5ff" fill-opacity=".07" stroke="#0b0e15" stroke-width="9"/>
    <rect x="268" y="242" width="80" height="62" rx="14"
          fill="#00e5ff" fill-opacity=".07" stroke="#0b0e15" stroke-width="9"/>
    <path d="M244 264 L268 264" stroke="#0b0e15" stroke-width="9" stroke-linecap="round"/>
    <path d="M164 262 L150 268" stroke="#0b0e15" stroke-width="9" stroke-linecap="round"/>
    <path d="M348 262 L362 268" stroke="#0b0e15" stroke-width="9" stroke-linecap="round"/>
    <path d="M176 288 L200 252" stroke="#ffffff" stroke-opacity=".30" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M280 288 L304 252" stroke="#ffffff" stroke-opacity=".30" stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <!-- rim light -->
  <path d="M146 258 C126 208 134 158 166 126" fill="none" stroke="#00e5ff"
        stroke-width="6" stroke-linecap="round" opacity=".75" filter="url(#soft)"/>
  <path d="M368 258 C388 208 380 156 348 124" fill="none" stroke="#ff2d78"
        stroke-width="6" stroke-linecap="round" opacity=".7" filter="url(#soft)"/>
</svg>
